name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://huooiccnyprldwjdikvq.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1b29pY2NueXBybGR3amRpa3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NzUyMDMsImV4cCI6MjEwMzQ1MTIwM30.6JPKVALiMIk178NQVak7uxLtJiNB3wNB6qw3kpklNwo' }}
      EXPO_PUBLIC_CANETO_API_URL: ${{ secrets.EXPO_PUBLIC_CANETO_API_URL || 'https://caneto.online' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version & APK Naming
        id: versioning
        run: |
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          RUN_NUM="${{ github.run_number }}"
          SHORT_SHA=$(git rev-parse --short HEAD)

          RELEASE_TAG="v${MAJOR_MINOR}.${RUN_NUM}"
          APK_NAME="caneto-${RELEASE_TAG}.apk"

          node -e "const fs=require('fs'); const app=require('./app.json'); const pkg=require('./package.json'); const lock=require('./package-lock.json'); const code=Number(process.env.GITHUB_RUN_NUMBER); if (!Number.isSafeInteger(code) || code <= app.expo.android.versionCode) throw Error('Build number must exceed committed Android versionCode'); const version=process.argv[1]; app.expo.version=version; app.expo.android.versionCode=code; pkg.version=version; lock.version=version; lock.packages[''].version=version; for (const [path,obj] of [['app.json',app],['package.json',pkg],['package-lock.json',lock]]) fs.writeFileSync(path,JSON.stringify(obj,null,2)+'\n');" "${MAJOR_MINOR}.${RUN_NUM}"
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "run_num=${RUN_NUM}" >> $GITHUB_OUTPUT

          echo "Generated Tag: $RELEASE_TAG"
          echo "Generated APK Name: $APK_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Create .env files for Metro Bundler
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_SUPABASE_URL=${{ env.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_CANETO_API_URL=${{ env.EXPO_PUBLIC_CANETO_API_URL }}
          EOF
          cp .env .env.local
          echo "Environment file prepared."

      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Required Android signing secrets are missing.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Expo Prebuild
        env:
          CANETO_GITHUB_RELEASE_SIGNING: '1'
        run: npx expo prebuild --platform android --clean

      - name: Verify release signing configuration
        run: |
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
          grep -q "CANETO_RELEASE_KEYSTORE_PATH" android/app/build.gradle

      - name: Ensure .env is present in Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp .env android/app/src/main/assets/.env || true

      - name: Build Android Release APK
        working-directory: android
        env:
          CANETO_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          CANETO_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CANETO_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CANETO_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_CANETO_API_URL: ${{ env.EXPO_PUBLIC_CANETO_API_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found in outputs!"
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "Found APK: $APK_FILE"
          mkdir -p build-release
          cp "$APK_FILE" "build-release/${{ steps.versioning.outputs.apk_name }}"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "build-release/${{ steps.versioning.outputs.apk_name }}"
          echo "Prepared asset at: build-release/${{ steps.versioning.outputs.apk_name }}"
          ls -la build-release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versioning.outputs.apk_name }}
          path: build-release/${{ steps.versioning.outputs.apk_name }}
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          APK_PATH="build-release/${{ steps.versioning.outputs.apk_name }}"
          COMMIT_MSG=$(git log -1 --pretty=%B)

          RELEASE_NOTES="### 📱 Caneto Native $TAG

          - **Arquivo APK:** \`${{ steps.versioning.outputs.apk_name }}\`
          - **Pacote:** \`com.evandromqs.caneto\`
          - **Commit:** \`${{ steps.versioning.outputs.short_sha }}\`
          - **Build:** \`#${{ steps.versioning.outputs.run_num }}\`

          #### O que mudou
          $COMMIT_MSG

          #### 📥 Como baixar e instalar:
          1. Baixe o arquivo \`${{ steps.versioning.outputs.apk_name }}\` anexado nesta release no seu celular.
          2. Abra o arquivo baixado para iniciar a instalação.
          3. Caso o Android solicite permissão, autorize a instalação de fontes desconhecidas."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading new asset..."
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" "$APK_PATH" \
              --title "Caneto $TAG (Build #${{ steps.versioning.outputs.run_num }})" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
