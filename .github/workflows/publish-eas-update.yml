name: Publish EAS Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal que receberá a atualização
        required: true
        type: choice
        default: preview
        options:
          - preview
          - staging
          - production
      message:
        description: Resumo da atualização
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eas-update-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and publish update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      UPDATE_CHANNEL: ${{ inputs.channel }}
      UPDATE_ENVIRONMENT: ${{ inputs.channel == 'production' && 'production' || 'preview' }}
      UPDATE_MESSAGE: ${{ inputs.message }}

    steps:
      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Configure o secret EXPO_TOKEN antes de publicar atualizações EAS.'; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate update bundle
        run: |
          node -e "const app=require('./app.json'); const pkg=require('./package.json'); if (app.expo.version !== pkg.version) throw Error('app.json e package.json possuem versões diferentes');"
          npm run lint
          npx tsc --noEmit
          npm run test:sync

      - name: Publish EAS Update
        run: npx --yes eas-cli@27.1.0 update --channel "$UPDATE_CHANNEL" --message "$UPDATE_MESSAGE" --environment "$UPDATE_ENVIRONMENT" --non-interactive
